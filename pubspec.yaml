name: mauzo
environment:
  sdk: '^3.8.0'
dependencies:
  get_storage: ^2.0.3
  excel: ^2.0.7
  file_picker: ^8.1.2
  permission_handler: ^12.0.1
  image_picker: ^1.1.2
  cloud_functions: ^6.0.4
  badges: ^3.1.1
  cached_network_image: ^3.2.3
  cloud_firestore: ^6.1.0
  firebase_auth: ^6.1.2
  firebase_storage: ^13.0.4
  firebase_core: ^4.2.1
  connectivity_plus: ^6.1.0
  firebase_storage_web: ^3.11.0
  google_sign_in: ^6.2.1
  smart_auth: ^1.1.1

  flutter:
    sdk: flutter
  flutter_image_compress: ^2.0.3
  mobile_scanner: ^7.1.3
  flutter_native_splash: ^2.3.1
  get: ^4.6.5
  fl_chart: ^0.35.0
  share_plus: ^10.1.2
  http: ^1.1.0
  intl: ^0.18.1
  timeago: ^3.7.0
  package_info_plus: ^4.0.2
  font_awesome_flutter: ^11.0.0
  pattern_formatter: ^3.0.0
  pinput: ^2.2.31
  shared_preferences: ^2.2.0
  app_links: ^6.4.0
  sticky_headers: ^0.3.0+2
  pdf: ^3.3.0
  printing: ^5.5.0
  path_provider: ^2.0.11
  url_launcher: ^6.1.5
  path: ^1.8.2
  email_validator: ^2.0.1
  provider: ^6.0.5
  google_mlkit_barcode_scanning: ^0.14.1
  universal_html: ^2.2.4
  print_bluetooth_thermal: ^1.1.1
  play_install_referrer: ^0.5.0
dev_dependencies:
  flutter_lints: ^2.0.2
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_native_splash:
  image: assets/images/splash.png
  color: "#ffffff"
  image_dark: assets/images/splash-dark.png
  color_dark: "#333333"

# Configure launcher icons generation for Windows
flutter_launcher_icons:
  windows:
    generate: true
    image_path: android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
