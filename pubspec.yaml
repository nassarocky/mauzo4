name: mauzo
description: Hesabu Mauzo. Easily manage your sales, income and products.
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.9.0+12
environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  get_storage: ^2.0.3
  excel: ^2.0.7
  permission_handler: ^11.3.0
  image_picker: ^1.1.2
  cloud_functions: ^5.1.5
  badges: ^3.1.1
  cached_network_image: ^3.2.3
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.3
  firebase_core: ^3.8.0
  firebase_storage: ^12.3.6
  connectivity_plus: ^6.1.0
  firebase_storage_web: ^3.6.5
  google_sign_in: ^6.2.1
  smart_auth: ^1.1.1

  flutter:
    sdk: flutter
  flutter_image_compress: ^2.0.3
  mobile_scanner: ^6.0.2
  flutter_native_splash: ^2.3.1
  get: ^4.6.5
  fl_chart: ^0.35.0
  share_plus: ^10.1.2
  http: ^1.1.0
  intl: ^0.18.1
  package_info_plus: ^4.0.2
  font_awesome_flutter: ^10.1.0
  pattern_formatter: ^3.0.0
  pinput: ^2.2.31
  shared_preferences: ^2.2.0
  sticky_headers: ^0.3.0+2
  pdf: ^3.3.0
  printing: ^5.5.0
  path_provider: ^2.0.11
  url_launcher: ^6.1.5
  path: ^1.8.2
  email_validator: ^2.0.1
  provider: ^6.0.5
  google_mlkit_barcode_scanning: ^0.14.1
dev_dependencies:
  flutter_lints: ^2.0.2
  flutter_test:
    sdk: flutter

flutter_native_splash:
  image: assets/images/splash.png
  color: "#ffffff"
  image_dark: assets/images/splash-dark.png
  color_dark: "#333333"

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
